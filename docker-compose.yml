services:
  postgres:
    image: postgres:17-alpine
    container_name: serverpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: serverpulse
      POSTGRES_USER: serverpulse
      POSTGRES_PASSWORD: serverpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
